name: Release - Linux (x64, arm64)
on:
  workflow_dispatch: null
  push:
    tags:
    - v*
    - test-release-*
jobs:
  build:
    strategy:
      matrix:
        include:
          - runs-on: ubuntu-latest
            arch: x64
          - runs-on: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runs-on }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v6
    - name: Build manylinux image
      run: docker build -t manylinux_2_34 -f .github/workflows/manylinux_2_34.Dockerfile .
    - name: Set SAPLING_VERSION
      shell: bash
      run: echo "SAPLING_VERSION=$(ci/tag-name.sh)" >> $GITHUB_ENV
    - name: Build
      shell: bash
      run: |
        mkdir -p "${RUNNER_TEMP}/manylinux-artifacts"
        docker run --rm \
          -e SAPLING_VERSION="${SAPLING_VERSION}" \
          -v "$PWD:/work" \
          -v "${RUNNER_TEMP}/manylinux-artifacts:/artifacts" \
          -w /work \
          manylinux_2_34 \
          bash -lc 'git config --global --add safe.directory /work && rustup default stable && cd /work/eden/scm && VERSION="${SAPLING_VERSION}" python3 ./packaging/manylinux/build.py --output-path "/artifacts/sapling-${SAPLING_VERSION}-linux-${{ matrix.arch }}.tar.xz"'
        sudo chown -R "$(id -u):$(id -g)" "${RUNNER_TEMP}/manylinux-artifacts"
    - name: Upload Artifact
      uses: actions/upload-artifact@v6
      with:
        name: sapling-linux-${{ matrix.arch }}
        path: ${{ runner.temp }}/manylinux-artifacts/sapling*.tar.xz
  publish:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Checkout Code
      uses: actions/checkout@v6
    - name: Grant Access
      run: git config --global --add safe.directory "$PWD"
    - name: Download Artifacts
      uses: actions/download-artifact@v7
      with:
        pattern: sapling-linux-*
        merge-multiple: true
    - name: Create pre-release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: bash ci/retry.sh bash ci/create-release.sh $(ci/tag-name.sh)
    - name: Upload Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        find . | grep tar.xz
        bash ci/retry.sh gh release upload --clobber $(ci/tag-name.sh) sapling*.tar.xz
